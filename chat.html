<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legal AI Agent | ISB BIOT</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Noto+Sans+JP:wght@300;400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Noto Sans JP', sans-serif; background: #0a0a0a; color: #e8e0d0; height: 100vh; display: flex; flex-direction: column; background-image: radial-gradient(ellipse at top, #1a1500 0%, #0a0a0a 60%); }
  .header { background: linear-gradient(135deg, #0d0d0d 0%, #1a1400 50%, #0d0d0d 100%); padding: 15px 30px; border-bottom: 1px solid #b8960c; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 20px rgba(184,150,12,0.2); }
  .header-left { display: flex; align-items: center; gap: 15px; }
  .logo { height: 55px; width: auto; filter: drop-shadow(0 0 8px rgba(184,150,12,0.4)); }
  .header-title h1 { font-family: 'Cormorant Garamond', serif; color: #c9a84c; font-size: 22px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
  .header-title h2 { color: #8a7a5a; font-size: 11px; font-weight: 300; letter-spacing: 2px; margin-top: 2px; }
  .header-center { text-align: center; color: #6a5a3a; font-size: 10px; letter-spacing: 1px; line-height: 1.6; }
  .header-right { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
  .history-badge { background: linear-gradient(135deg, #1a1400, #2a2000); border: 1px solid #b8960c; color: #c9a84c; padding: 4px 12px; border-radius: 20px; font-size: 11px; letter-spacing: 1px; }
  .reset-btn { background: transparent; color: #6a5a3a; border: 1px solid #3a3020; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 11px; letter-spacing: 1px; transition: all 0.3s; }
  .reset-btn:hover { border-color: #b8960c; color: #c9a84c; }
  .gold-divider { height: 1px; background: linear-gradient(90deg, transparent, #b8960c, #ffd700, #b8960c, transparent); }
  .lang-bar { background: linear-gradient(135deg, #0d0d0d, #1a1400); padding: 10px 30px; display: flex; gap: 10px; align-items: center; border-bottom: 1px solid #2a2010; }
  .lang-label { color: #4a3a2a; font-size: 10px; letter-spacing: 2px; text-transform: uppercase; margin-right: 5px; }
  .lang-btn { background: transparent; border: 1px solid #3a3020; color: #6a5a3a; padding: 5px 14px; border-radius: 20px; cursor: pointer; font-size: 12px; letter-spacing: 1px; transition: all 0.3s; font-family: 'Noto Sans JP', sans-serif; }
  .lang-btn:hover { border-color: #b8960c; color: #c9a84c; }
  .lang-btn.active { background: linear-gradient(135deg, #b8960c, #8a6e08); border-color: #b8960c; color: #0a0a0a; font-weight: 700; }
  .chat-container { flex: 1; overflow-y: auto; padding: 30px; display: flex; flex-direction: column; gap: 20px; }
  .chat-container::-webkit-scrollbar { width: 4px; }
  .chat-container::-webkit-scrollbar-track { background: #0a0a0a; }
  .chat-container::-webkit-scrollbar-thumb { background: #3a3020; border-radius: 2px; }
  .message { max-width: 85%; padding: 18px 22px; border-radius: 4px; line-height: 1.8; font-size: 14px; }
  .message.user { background: linear-gradient(135deg, #1a1400, #2a2000); border: 1px solid #3a3020; border-left: 3px solid #b8960c; align-self: flex-end; }
  .message.ai { background: linear-gradient(135deg, #0f0f0f, #1a1a0f); border: 1px solid #2a2a1a; border-left: 3px solid #4a4a2a; align-self: flex-start; }
  .message .label { font-size: 10px; font-weight: 500; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 10px; }
  .message.user .label { color: #c9a84c; }
  .message.ai .label { color: #6a8a6a; }
  .law-badge { background: linear-gradient(135deg, #0f0f08, #1a1a08); border: 1px solid #3a3a1a; color: #8a8a4a; padding: 8px 14px; border-radius: 4px; font-size: 11px; margin-top: 12px; letter-spacing: 1px; }
  .law-badge span { color: #c9a84c; }
  .company-badge { background: linear-gradient(135deg, #0f0a08, #1a1008); border: 1px solid #3a2a1a; color: #8a6a4a; padding: 8px 14px; border-radius: 4px; font-size: 11px; margin-top: 8px; letter-spacing: 1px; }
  .company-badge span { color: #c9844c; }

  /* ファイルアップロードエリア */
  .upload-area { background: linear-gradient(135deg, #0d0d0d, #1a1400); padding: 12px 30px; border-bottom: 1px solid #2a2010; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .upload-btn { background: transparent; border: 1px solid #b8960c; color: #c9a84c; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 12px; letter-spacing: 1px; transition: all 0.3s; font-family: 'Noto Sans JP', sans-serif; display: flex; align-items: center; gap: 6px; }
  .upload-btn:hover { background: rgba(184,150,12,0.1); }
  .file-info { color: #6a5a3a; font-size: 12px; letter-spacing: 1px; flex: 1; }
  .file-info.active { color: #c9a84c; }
  .analyze-btn { background: linear-gradient(135deg, #2a1a00, #3a2a00); border: 1px solid #b8960c; color: #c9a84c; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 12px; letter-spacing: 1px; transition: all 0.3s; font-family: 'Noto Sans JP', sans-serif; display: none; }
  .analyze-btn:hover { background: linear-gradient(135deg, #b8960c, #8a6e08); color: #0a0a0a; }
  .analyze-btn.visible { display: block; }
  #fileInput { display: none; }

  .input-area { background: linear-gradient(135deg, #0d0d0d, #1a1400); padding: 20px 30px; border-top: 1px solid #b8960c; display: flex; gap: 12px; align-items: flex-end; }
  textarea { flex: 1; background: #0f0f0f; border: 1px solid #3a3020; color: #e8e0d0; padding: 14px 18px; border-radius: 4px; font-size: 14px; font-family: 'Noto Sans JP', sans-serif; resize: none; height: 60px; outline: none; transition: border-color 0.3s; }
  textarea:focus { border-color: #b8960c; }
  textarea::placeholder { color: #3a3020; }
  button { background: linear-gradient(135deg, #b8960c, #8a6e08); color: #0a0a0a; border: none; padding: 14px 28px; border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; transition: all 0.3s; font-family: 'Cormorant Garamond', serif; }
  button:hover { background: linear-gradient(135deg, #d4a810, #b8960c); box-shadow: 0 0 20px rgba(184,150,12,0.4); }
  button:disabled { background: #2a2a1a; color: #3a3a2a; cursor: not-allowed; box-shadow: none; }
  .loading { color: #4a4a2a; font-style: italic; letter-spacing: 1px; }
  .welcome { text-align: center; margin: auto; padding: 40px; }
  .welcome-logo { height: 80px; margin-bottom: 20px; filter: drop-shadow(0 0 15px rgba(184,150,12,0.3)); }
  .welcome h2 { font-family: 'Cormorant Garamond', serif; color: #c9a84c; font-size: 28px; letter-spacing: 4px; margin-bottom: 8px; }
  .welcome p { color: #4a3a2a; font-size: 12px; letter-spacing: 2px; line-height: 2; }
  .welcome-divider { width: 200px; height: 1px; background: linear-gradient(90deg, transparent, #b8960c, transparent); margin: 15px auto; }
  .file-badge { background: linear-gradient(135deg, #0f0a0f, #1a0a1a); border: 1px solid #4a2a4a; color: #8a6a8a; padding: 8px 14px; border-radius: 4px; font-size: 11px; margin-top: 8px; letter-spacing: 1px; }
  .file-badge span { color: #c984c9; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <img src="images/logo_center.PNG" alt="Logo" class="logo" onerror="this.style.display='none'">
    <div class="header-title">
      <h1>Legal AI Agent</h1>
      <h2>法務戦略AIパートナー | Global Legal Intelligence</h2>
    </div>
  </div>
  <div class="header-center">Japan · USA · EU · Asia<br>24/7 Global Legal Strategy</div>
  <div class="header-right">
    <span class="history-badge" id="historyBadge">SESSION · 0</span>
    <button class="reset-btn" onclick="resetSession()">↺ NEW SESSION</button>
  </div>
</div>

<div class="gold-divider"></div>

<div class="lang-bar">
  <span class="lang-label">Language</span>
  <button class="lang-btn active" onclick="setLang('ja', this)">🇯🇵 日本語</button>
  <button class="lang-btn" onclick="setLang('en', this)">🇺🇸 English</button>
  <button class="lang-btn" onclick="setLang('zh', this)">🇨🇳 中文</button>
  <button class="lang-btn" onclick="setLang('ko', this)">🇰🇷 한국어</button>
</div>

<!-- ファイルアップロードエリア -->
<div class="upload-area">
  <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
    📎 ファイルを添付 / Attach File
  </button>
  <input type="file" id="fileInput" accept=".pdf,.docx" onchange="handleFileSelect(this)">
  <span class="file-info" id="fileInfo">PDF・Word(.docx)ファイルを添付できます</span>
  <button class="analyze-btn" id="analyzeBtn" onclick="analyzeDocument()">
    🔍 この文書を分析
  </button>
</div>

<div class="chat-container" id="chatContainer">
  <div class="welcome">
    <img src="images/logo_center.PNG" alt="Logo" class="welcome-logo" onerror="this.style.display='none'">
    <div class="welcome-divider"></div>
    <h2>LEGAL AI PARTNER</h2>
    <p id="welcomeText">
      世界中の法律を学習した専任法務戦略パートナー<br>
      Japan · USA · EU · Asia · Blockchain · Pharma
    </p>
    <div class="welcome-divider"></div>
  </div>
</div>

<div class="input-area">
  <textarea id="userInput" placeholder="法務戦略についてご相談ください..." onkeydown="handleKey(event)"></textarea>
  <button id="sendBtn" onclick="sendMessage()">Send</button>
</div>

<script>
const sessionId = 'session-' + Date.now();
let currentLang = 'ja';
let selectedFile = null;

const langConfig = {
  ja: {
    placeholder: '法務戦略についてご相談ください...',
    welcome: '世界中の法律を学習した専任法務戦略パートナー<br>Japan · USA · EU · Asia · Blockchain · Pharma',
    sending: '分析中...', loading: 'グローバル法律データベースを分析中...',
    youLabel: '👤 あなた', aiLabel: '⚖️ 法務AIパートナー',
    lawLabel: '◆ 参照法令：', companyLabel: '◆ 自社文書参照済',
    fileLabel: '◆ 分析ファイル：', resetMsg: '新しいご相談をどうぞ',
    instruction: '回答は必ず日本語で行ってください。',
    analyzeBtn: '🔍 この文書を分析', attachBtn: '📎 ファイルを添付 / Attach File',
    fileInfo: 'PDF・Word(.docx)ファイルを添付できます',
    analyzeInstruction: 'この文書を法的に詳しく分析してください。リスク・問題点・反論ポイント・交渉戦略を教えてください。'
  },
  en: {
    placeholder: 'Enter your legal inquiry...',
    welcome: 'Your Dedicated Global Legal Strategy Partner<br>Japan · USA · EU · Asia · Blockchain · Pharma',
    sending: 'Analyzing...', loading: 'Analyzing global legal database...',
    youLabel: '👤 You', aiLabel: '⚖️ Legal AI Partner',
    lawLabel: '◆ Referenced Law: ', companyLabel: '◆ Company Docs Referenced',
    fileLabel: '◆ Analyzed File: ', resetMsg: 'Please enter your new inquiry',
    instruction: 'Please respond in English.',
    analyzeBtn: '🔍 Analyze Document', attachBtn: '📎 Attach File',
    fileInfo: 'You can attach PDF or Word(.docx) files',
    analyzeInstruction: 'Please analyze this document legally in detail. Identify risks, issues, counter-arguments, and negotiation strategies.'
  },
  zh: {
    placeholder: '请输入您的法律咨询...',
    welcome: '您的专属全球法律战略合作伙伴<br>Japan · USA · EU · Asia · Blockchain · Pharma',
    sending: '分析中...', loading: '正在分析全球法律数据库...',
    youLabel: '👤 您', aiLabel: '⚖️ 法律AI顾问',
    lawLabel: '◆ 参考法律：', companyLabel: '◆ 已参考公司文件',
    fileLabel: '◆ 分析文件：', resetMsg: '请输入新的咨询内容',
    instruction: '请用中文回答。',
    analyzeBtn: '🔍 分析文件', attachBtn: '📎 附加文件',
    fileInfo: '可以附加PDF或Word(.docx)文件',
    analyzeInstruction: '请详细分析这份文件的法律问题、风险、反驳要点和谈判策略。'
  },
  ko: {
    placeholder: '법률 전략에 대해 문의하세요...',
    welcome: '전 세계 법률을 학습한 전담 법무 전략 파트너<br>Japan · USA · EU · Asia · Blockchain · Pharma',
    sending: '분석 중...', loading: '글로벌 법률 데이터베이스 분석 중...',
    youLabel: '👤 귀하', aiLabel: '⚖️ 법무 AI 파트너',
    lawLabel: '◆ 참조 법령: ', companyLabel: '◆ 사내 문서 참조됨',
    fileLabel: '◆ 분석 파일: ', resetMsg: '새로운 문의를 입력하세요',
    instruction: '한국어로 답변해 주세요.',
    analyzeBtn: '🔍 문서 분석', attachBtn: '📎 파일 첨부',
    fileInfo: 'PDF 또는 Word(.docx) 파일을 첨부할 수 있습니다',
    analyzeInstruction: '이 문서를 법적으로 상세히 분석해 주세요. 위험, 문제점, 반론 포인트, 협상 전략을 알려주세요.'
  }
};

function setLang(lang, btn) {
  currentLang = lang;
  const config = langConfig[lang];
  document.getElementById('userInput').placeholder = config.placeholder;
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const welcomeText = document.getElementById('welcomeText');
  if (welcomeText) welcomeText.innerHTML = config.welcome;
  document.getElementById('analyzeBtn').textContent = config.analyzeBtn;
  const fileInfo = document.getElementById('fileInfo');
  if (!selectedFile) fileInfo.textContent = config.fileInfo;
}

function handleFileSelect(input) {
  const config = langConfig[currentLang];
  if (input.files && input.files[0]) {
    selectedFile = input.files[0];
    const fileInfo = document.getElementById('fileInfo');
    fileInfo.textContent = `📄 ${selectedFile.name}`;
    fileInfo.classList.add('active');
    document.getElementById('analyzeBtn').classList.add('visible');
  }
}

async function analyzeDocument() {
  if (!selectedFile) return;
  const config = langConfig[currentLang];
  const container = document.getElementById('chatContainer');
  const btn = document.getElementById('sendBtn');
  const analyzeBtn = document.getElementById('analyzeBtn');

  const welcome = container.querySelector('.welcome');
  if (welcome) welcome.remove();

  container.innerHTML += `
    <div class="message user">
      <div class="label">${config.youLabel}</div>
      📄 ${selectedFile.name}<br>${config.analyzeInstruction}
    </div>`;

  analyzeBtn.disabled = true;
  analyzeBtn.textContent = config.sending;

  const loadingId = 'loading-' + Date.now();
  container.innerHTML += `<div class="message ai" id="${loadingId}"><div class="label">${config.aiLabel}</div><span class="loading">📄 ${config.loading}</span></div>`;
  container.scrollTop = container.scrollHeight;

  try {
    const formData = new FormData();
    formData.append('file', selectedFile);
    formData.append('instruction', config.instruction + '\n\n' + config.analyzeInstruction);
    formData.append('session_id', sessionId);

    const response = await fetch('https://pretzel-customize-chaste.ngrok-free.dev/analyze-document', {
      method: 'POST',
      body: formData
    });

    const data = await response.json();

    if (data.error) {
      document.getElementById(loadingId).innerHTML = `<div class="label">${config.aiLabel}</div>エラー: ${data.error}`;
    } else {
      const answer = data.answer.replace(/\n/g, '<br>');
      let badges = `<div class="file-badge"><span>${config.fileLabel}</span>${selectedFile.name}</div>`;
      if (data.referenced_laws) badges += `<div class="law-badge"><span>${config.lawLabel}</span>${data.referenced_laws}</div>`;
      if (data.company_docs_used) badges += `<div class="company-badge"><span>${config.companyLabel}</span></div>`;

      document.getElementById(loadingId).innerHTML = `<div class="label">${config.aiLabel}</div>${answer}${badges}`;
      document.getElementById('historyBadge').textContent = `SESSION · ${Math.floor(data.history_count / 2)}`;
    }
  } catch (error) {
    document.getElementById(loadingId).innerHTML = `<div class="label">${config.aiLabel}</div>エラーが発生しました。`;
  }

  analyzeBtn.disabled = false;
  analyzeBtn.textContent = config.analyzeBtn;
  selectedFile = null;
  document.getElementById('fileInput').value = '';
  document.getElementById('fileInfo').textContent = config.fileInfo;
  document.getElementById('fileInfo').classList.remove('active');
  document.getElementById('analyzeBtn').classList.remove('visible');
  container.scrollTop = container.scrollHeight;
}

async function sendMessage() {
  const input = document.getElementById('userInput');
  const message = input.value.trim();
  if (!message) return;

  const config = langConfig[currentLang];
  const container = document.getElementById('chatContainer');
  const btn = document.getElementById('sendBtn');

  const welcome = container.querySelector('.welcome');
  if (welcome) welcome.remove();

  container.innerHTML += `
    <div class="message user">
      <div class="label">${config.youLabel}</div>
      ${message.replace(/\n/g, '<br>')}
    </div>`;

  input.value = '';
  btn.disabled = true;
  btn.textContent = config.sending;

  const loadingId = 'loading-' + Date.now();
  container.innerHTML += `<div class="message ai" id="${loadingId}"><div class="label">${config.aiLabel}</div><span class="loading">${config.loading}</span></div>`;
  container.scrollTop = container.scrollHeight;

  try {
    const fullMessage = config.instruction + '\n\n' + message;
    const response = await fetch('https://pretzel-customize-chaste.ngrok-free.dev/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: fullMessage, session_id: sessionId })
    });

    const data = await response.json();
    const answer = data.answer.replace(/\n/g, '<br>');
    let badges = '';
    if (data.referenced_laws) badges += `<div class="law-badge"><span>${config.lawLabel}</span>${data.referenced_laws}</div>`;
    if (data.company_docs_used) badges += `<div class="company-badge"><span>${config.companyLabel}</span></div>`;

    document.getElementById(loadingId).innerHTML = `<div class="label">${config.aiLabel}</div>${answer}${badges}`;
    document.getElementById('historyBadge').textContent = `SESSION · ${Math.floor(data.history_count / 2)}`;

  } catch (error) {
    document.getElementById(loadingId).innerHTML = `<div class="label">${config.aiLabel}</div>サーバーが起動しているか確認してください。`;
  }

  btn.disabled = false;
  btn.textContent = 'Send';
  container.scrollTop = container.scrollHeight;
}

async function resetSession() {
  const config = langConfig[currentLang];
  await fetch(`https://pretzel-customize-chaste.ngrok-free.dev/session/${sessionId}`, { method: 'DELETE' });
  document.getElementById('chatContainer').innerHTML = `
    <div class="welcome">
      <img src="images/logo_center.PNG" alt="Logo" class="welcome-logo" onerror="this.style.display='none'">
      <div class="welcome-divider"></div>
      <h2>NEW SESSION</h2>
      <p id="welcomeText">${config.resetMsg}</p>
      <div class="welcome-divider"></div>
    </div>`;
  document.getElementById('historyBadge').textContent = 'SESSION · 0';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}
</script>

</body>
</html>
